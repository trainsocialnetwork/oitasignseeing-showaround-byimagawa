<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大分たびヒアリング</title>
<meta name="description" content="大分旅行のおすすめを考えるためのヒアリングフォーム。質問に答えて、結果をLINEで送ってね。">
<style>
  :root {
    --bg: #f7f2e9;
    --card: #ffffff;
    --text: #33302b;
    --sub: #8a8478;
    --accent: #2a6f77;      /* 温泉の湯けむりをイメージした深い青緑 */
    --accent-light: #e3eef0;
    --yuzu: #e0912f;        /* かぼす・ゆず色 */
    --border: #e5ddd0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    padding: 20px 18px 40px;
    display: flex;
    flex-direction: column;
  }
  svg.ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; }

  header {
    text-align: center;
    padding: 6px 0 18px;
  }
  header .logo {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  header .logo svg { width: 1.5em; height: 1.5em; color: var(--accent); }
  header .logo span { color: var(--accent); }

  /* 進み具合バー */
  .progress-wrap { margin-bottom: 18px; display: none; }
  .progress-label { font-size: 0.75rem; color: var(--sub); text-align: right; margin-bottom: 5px; }
  .progress-bar { height: 8px; background: #e9e2d4; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }

  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 24px 20px;
    box-shadow: 0 2px 14px rgba(80, 70, 50, 0.08);
    animation: fadein 0.25s ease;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-section {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-light);
    padding: 3px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .q-title { font-size: 1.15rem; font-weight: 700; line-height: 1.5; margin-bottom: 6px; }
  .q-note { font-size: 0.8rem; color: var(--sub); margin-bottom: 14px; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .opt-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    text-align: left;
    font-size: 0.95rem;
    font-family: inherit;
    padding: 13px 15px;
    background: #fdfcf9;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.4;
  }
  .opt-btn:active { background: var(--accent-light); }
  /* 左の丸チェック */
  .opt-btn::before {
    content: "";
    flex: 0 0 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    background: #fff;
    transition: background 0.15s, border-color 0.15s;
  }
  .opt-btn.selected {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .opt-btn.selected::before {
    border-color: var(--accent);
    background: var(--accent) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>') no-repeat center / 70%;
  }

  .opt-label { flex: 1; }
  .opt-desc {
    display: block;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--sub);
    margin-top: 3px;
    line-height: 1.5;
  }

  textarea {
    width: 100%;
    min-height: 100px;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: #fdfcf9;
    resize: vertical;
    margin-top: 14px;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .nav { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active:not(:disabled) { opacity: 0.85; }
  .btn-back {
    flex: 0 0 auto;
    background: transparent;
    color: var(--sub);
    border: 1.5px solid var(--border);
    padding: 14px 18px;
  }

  /* スタート画面 */
  .start-card { padding: 0; overflow: hidden; }
  .hero-img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
  .start-body { padding: 22px 20px 26px; text-align: center; }
  .start-body h1 { font-size: 1.25rem; line-height: 1.5; margin-bottom: 10px; }
  .start-body p { font-size: 0.9rem; color: var(--sub); line-height: 1.9; }
  .start-body .time {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-light);
    padding: 5px 16px;
    border-radius: 999px;
  }

  /* 結果画面 */
  .done-hero { text-align: center; margin-bottom: 16px; }
  .done-hero svg { width: 52px; height: 52px; color: var(--accent); }
  .done-hero h2 { font-size: 1.2rem; margin-top: 8px; }
  .copy-status {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.7;
    padding: 12px 14px;
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .copy-status.ok { background: var(--accent-light); color: var(--accent); }
  .copy-status.ng { background: #fbeede; color: var(--yuzu); }
  .result-text {
    width: 100%;
    font-family: inherit;
    font-size: 0.82rem;
    line-height: 1.6;
    padding: 14px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: #fdfcf9;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 240px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .done-img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 14px; margin-top: 20px; display: block; }
  .done-note { text-align: center; font-size: 0.85rem; color: var(--sub); margin-top: 12px; line-height: 1.7; }
  .restart {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--sub);
    font-size: 0.82rem;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  footer { text-align: center; margin-top: 24px; font-size: 0.72rem; color: var(--sub); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <!-- 温泉マーク -->
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5c-2.5 3 2.5 5.5 0 9"/>
        <path d="M24 3c-2.5 3 2.5 5.5 0 9"/>
        <path d="M33 5c-2.5 3 2.5 5.5 0 9"/>
        <path d="M6 26c0 9.5 8 15 18 15s18-5.5 18-15"/>
        <path d="M3 26h42"/>
      </svg>
      大分<span>たび</span>ヒアリング
    </div>
  </header>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="screen"></div>

  <footer>おおいた案内 by いまがわ</footer>
</div>

<script>
// ---- アイコン（インラインSVG） ----
const ICONS = {
  // 紙飛行機（送る）
  send: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
  // コピー（四角2枚）
  copy: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  // 吹き出し（トーク）
  talk: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.5-.76L3 21l1.76-6A8.5 8.5 0 1 1 21 11.5z"/></svg>',
  // 丸チェック（完了）
  check: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M15 24.5l6.5 6.5L33 18"/></svg>',
};

// ---- 質問リスト ----
// type: single = 1つ選ぶ / multi = 複数選べる / text = 自由入力
const QUESTIONS = [
  // --- 旅の基本 ---
  { section: "旅の基本", q: "大分に来るのは初めて？", type: "single",
    options: ["初めて", "2回目くらい", "何度も来ている・けっこう詳しい"] },
  { section: "旅の基本", q: "誰と大分に行く？", type: "single",
    options: ["ひとり旅", "夫婦・カップル", "友達と", "家族（子ども連れ）", "家族（大人だけ）"] },
  { section: "旅の基本", q: "何泊する予定？", type: "single",
    options: ["日帰り", "1泊2日", "2泊3日", "3泊以上", "まだ決めてない"] },
  { section: "旅の基本", q: "いつ頃来る予定？", type: "single",
    options: ["春（3〜5月）", "夏（6〜8月）", "秋（9〜11月）", "冬（12〜2月）", "まだ決めてない"] },
  { section: "旅の基本", q: "大分までの行き方は？", note: "到着する場所で回りやすいルートが変わります", type: "single",
    options: ["飛行機（大分空港）", "新幹線・特急ソニック（小倉経由）", "車で行く", "フェリー（さんふらわあ など）", "まだ決めてない"] },
  { section: "旅の基本", q: "現地での移動手段は？", type: "single",
    options: ["車・レンタカー", "電車・バスなどの公共交通", "まだ決めてない・相談したい"] },

  // --- やりたいこと ---
  { section: "やりたいこと", q: "旅のペースはどうしたい？", type: "single",
    options: ["とにかくゆっくりしたい", "のんびりメイン＋少し観光", "バランスよく", "アクティブにたくさん回りたい"] },
  { section: "やりたいこと", q: "旅でやりたいことは？", note: "当てはまるもの、ぜんぶ選んでOK", type: "multi",
    options: ["温泉にゆっくり浸かる", "自然・絶景を味わう", "有名な観光地をおさえる", "地元の人が行くような穴場", "美味しいものを食べる", "体験もの", "神社・お寺・歴史さんぽ", "街歩き・カフェ巡り", "動物・水族館・テーマパーク", "サウナで整う"],
    descs: [
      null,
      "由布岳、九重\"夢\"大吊橋、東洋のナイアガラと呼ばれる滝など",
      null,
      null,
      null,
      "地獄蒸し調理、砂湯、器の絵付け、着物で城下町さんぽ など",
      null,
      null,
      "うみたまご水族館、高崎山のサル、アフリカンサファリ、サンリオのハーモニーランドなど",
      "大分は温泉だけでなくサウナも熱い。川沿いのテントサウナや高級サウナも",
    ] },
  { section: "やりたいこと", q: "気になっている場所はある？", note: "複数選択OK。知らない場所は説明を読んでピンときたらでOK", type: "multi",
    options: ["別府", "湯布院", "宇佐神宮・中津", "国東半島", "耶馬渓", "日田・豆田町", "くじゅう・竹田", "臼杵・豊後大野・佐伯", "特にない・おまかせ"],
    descs: [
      "地獄めぐり・砂湯・湯けむり、日本一の温泉のまち",
      "由布岳のふもとのおしゃれな温泉街をさんぽ",
      "全国の八幡さまの総本宮と、からあげの聖地",
      "くにさきはんとう／お寺と仏像の里、夕日がきれいな海岸ものどか",
      "やばけい／岩がそびえる渓谷、紅葉の名所。手掘りのトンネル「青の洞門」も",
      "ひた・まめだまち／九州の小京都と呼ばれる古い街並みと、素朴な焼き物の里",
      "雄大な高原ドライブと、しゅわしゅわの炭酸泉「長湯温泉」",
      "うすき・ぶんごおおの・さいき／国宝の石仏・大きな滝・水中鍾乳洞・海の幸",
      "よく分からないので、おすすめにお任せしたい",
    ] },

  // --- 温泉 ---
  { section: "温泉", q: "温泉はどう楽しみたい？", note: "複数選択OK", type: "multi",
    options: ["露天風呂でのんびり", "砂湯・蒸し湯・泥湯など変わり種", "いろんな温泉を湯めぐり", "貸切風呂・家族風呂", "地元の人が通う共同浴場", "温泉はそこまでこだわらない"],
    descs: [
      null,
      "砂に埋まる、蒸される、泥パック。別府ならではの入り方いろいろ",
      "別府には泉質の違う8つの温泉郷「別府八湯」があります",
      null,
      "数百円で入れる、昔ながらの渋い温泉。まさに知る人ぞ知る楽しみ",
      null,
    ] },

  // --- グルメ ---
  { section: "グルメ", q: "好きなもの・食べたいものは？", note: "複数選択OK。大分のご当地グルメから気になるものを選んでね", type: "multi",
    options: ["関あじ・関さば・海鮮", "りゅうきゅう", "とり天", "からあげ", "地獄蒸し", "だんご汁・やせうま", "別府冷麺・日田やきそば", "豊後牛・焼肉", "スイーツ・カフェ", "お酒・地酒"],
    descs: [
      "速い潮で育った大分自慢のブランド魚。臼杵のふぐ、佐伯のお寿司も",
      "新鮮な魚を甘めのタレに漬けた郷土の味。ご飯にのせても最高",
      "大分発祥、鶏肉の天ぷら。かぼすポン酢とからしで",
      "中津・宇佐は「からあげの聖地」。専門店の揚げたてを",
      "温泉の蒸気で海鮮や野菜を蒸して食べる、別府名物の体験グルメ",
      "平たい小麦だんご入りの汁ものと、きなこの素朴なおやつ",
      "ご当地の麺グルメ。別府冷麺は温泉街の焼肉店の定番",
      "とろける大分のブランド牛",
      "湯布院の温泉街スイーツやおしゃれカフェ",
      "麦焼酎（いいちこ・二階堂は大分生まれ）や地酒、かぼすサワー",
    ] },
  { section: "グルメ", q: "苦手な食べ物やアレルギーはある？", note: "なければ空欄のまま「次へ」でOK", type: "text",
    placeholder: "例：生ものが苦手、えびアレルギー など" },

  // --- 宿 ---
  { section: "宿", q: "宿に求めるものは？", note: "複数選択OK", type: "multi",
    options: ["一泊は贅沢したい", "コスパ重視", "温泉自慢の宿", "部屋風呂・貸切風呂つき", "ご飯がおいしい宿", "静かで落ち着ける", "眺めがいい", "素泊まりでOK"] },
  { section: "宿", q: "宿の予算は？（1人1泊あたり）", type: "single",
    options: ["〜1万円", "1〜2万円", "2〜3万円", "3万円以上（贅沢に）", "まだ決めてない"] },

  // --- 最後に ---
  { section: "最後に", q: "ほかにリクエストや伝えたいことがあれば！", note: "なければ空欄のまま「回答を送る」でOK", type: "text",
    placeholder: "例：歩くのが苦手な人がいる、運転できる人がいない、朝はゆっくりしたい など" },
];

const screen = document.getElementById("screen");
const progressWrap = document.getElementById("progressWrap");
const progressLabel = document.getElementById("progressLabel");
const progressFill = document.getElementById("progressFill");

let current = 0;
let answers = [];   // 質問ごとの回答（multiは配列、それ以外は文字列）

// ---- スタート画面 ----
function renderStart() {
  progressWrap.style.display = "none";
  screen.innerHTML = `
    <div class="card start-card">
      <img class="hero-img" src="img/beppu.jpeg" alt="湯けむりが立ちのぼる別府温泉の街並み">
      <div class="start-body">
        <h1>大分に遊びに来るあなたへ</h1>
        <p>ぴったりの宿や観光地をおすすめするために、<br>いくつか質問に答えてね。<br>最後に回答をコピーして、<br>LINEで送ってくれたら準備完了！</p>
        <div class="time">全${QUESTIONS.length}問・2〜3分</div>
        <div class="nav">
          <button class="btn btn-primary" id="startBtn">はじめる</button>
        </div>
      </div>
    </div>`;
  document.getElementById("startBtn").onclick = () => { current = 0; renderQuestion(); };
}

// ---- 質問画面 ----
function renderQuestion() {
  const item = QUESTIONS[current];
  progressWrap.style.display = "block";
  progressLabel.textContent = `${current + 1} / ${QUESTIONS.length}`;
  progressFill.style.width = `${((current + 1) / QUESTIONS.length) * 100}%`;

  const isLast = current === QUESTIONS.length - 1;
  const nextLabel = isLast ? `${ICONS.send} 回答を送る` : "次へ";
  let body = "";

  if (item.type === "single" || item.type === "multi") {
    body = `<div class="options">` +
      item.options.map((opt, i) => {
        const d = item.descs ? item.descs[i] : null;
        return `<button class="opt-btn" data-i="${i}"><span class="opt-label">${opt}${d ? `<span class="opt-desc">${d}</span>` : ""}</span></button>`;
      }).join("") +
      `</div>`;
  } else {
    body = `<textarea id="freeText" placeholder="${item.placeholder || ""}"></textarea>`;
  }

  // single は選んだら自動で次に進むので「次へ」ボタンは出さない
  const showNext = item.type !== "single";
  screen.innerHTML = `
    <div class="card">
      ${item.section ? `<div class="q-section">${item.section}</div>` : ""}
      <div class="q-title">Q${current + 1}. ${item.q}</div>
      ${item.note ? `<div class="q-note">${item.note}</div>` : ""}
      ${body}
      <div class="nav">
        ${current > 0 ? `<button class="btn btn-back" id="backBtn">戻る</button>` : ""}
        ${showNext ? `<button class="btn btn-primary" id="nextBtn" ${item.type === "multi" ? "disabled" : ""}>${nextLabel}</button>` : ""}
      </div>
    </div>`;

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => { current--; renderQuestion(); };

  // 前に戻ってきたときは、選んでいた内容を復元する
  const saved = answers[current];

  if (item.type === "single") {
    const btns = [...screen.querySelectorAll(".opt-btn")];
    btns.forEach((btn) => {
      if (saved === item.options[btn.dataset.i]) btn.classList.add("selected");
      btn.onclick = () => {
        btns.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        answers[current] = item.options[btn.dataset.i];
        // 選んだ感を少し見せてから次へ
        setTimeout(() => goNext(), 200);
      };
    });
  } else if (item.type === "multi") {
    const btns = [...screen.querySelectorAll(".opt-btn")];
    const nextBtn = document.getElementById("nextBtn");
    const selected = new Set(Array.isArray(saved) ? saved : []);
    btns.forEach((btn) => {
      if (selected.has(btn.dataset.i)) btn.classList.add("selected");
      btn.onclick = () => {
        btn.classList.toggle("selected");
        if (btn.classList.contains("selected")) selected.add(btn.dataset.i);
        else selected.delete(btn.dataset.i);
        nextBtn.disabled = selected.size === 0;
      };
    });
    nextBtn.disabled = selected.size === 0;
    nextBtn.onclick = () => {
      answers[current] = [...selected];
      goNext();
    };
  } else {
    const ta = document.getElementById("freeText");
    if (typeof saved === "string") ta.value = saved;
    document.getElementById("nextBtn").onclick = () => {
      answers[current] = ta.value.trim();
      goNext();
    };
  }
}

function goNext() {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    finish();
  }
}

// ---- 回答テキストを作る ----
function buildResultText() {
  const lines = ["【大分たびヒアリング 回答】", "――――――――――"];
  QUESTIONS.forEach((item, i) => {
    let ans = answers[i];
    if (Array.isArray(ans)) {
      ans = ans.map((idx) => item.options[idx]).join("、");
    }
    if (!ans) ans = "特になし";
    lines.push(`Q${i + 1}. ${item.q}`);
    lines.push(`A. ${ans}`);
    lines.push("");
  });
  return lines.join("\n").trim();
}

// ---- コピー処理 ----
// LINEアプリ内ブラウザなどでは clipboard API が使えないことがあるので、
// 古い方法（execCommand）にもフォールバックする
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}

// ---- 結果画面 ----
function finish() {
  const text = buildResultText();
  // 「回答を送る」ボタンのタップをきっかけにコピーする（タップ直後ならコピーが許可されるため）
  copyText(text).then((ok) => renderDone(text, ok));
}

function renderDone(text, copied) {
  progressWrap.style.display = "none";
  screen.innerHTML = `
    <div class="card">
      <div class="done-hero">
        ${ICONS.check}
        <h2>回答ありがとう！</h2>
      </div>
      <div class="copy-status ${copied ? "ok" : "ng"}" id="copyStatus">
        ${copied
          ? `回答をコピーしました！<br>このままLINEに貼って送ってね ${ICONS.talk}`
          : `下のボタンで回答をコピーして、<br>LINEに貼って送ってね ${ICONS.talk}`}
      </div>
      <div class="result-text">${text.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>
      <div class="nav">
        <button class="btn btn-primary" id="copyBtn">${ICONS.copy} 回答をコピーする</button>
      </div>
      <img class="done-img" src="img/yufuin.jpeg" alt="由布岳を望む湯布院の街並み">
      <p class="done-note">回答をもとに、ぴったりのプランを考えて待ってるね。<br>それでは大分で会いましょう！</p>
      <button class="restart" id="restartBtn">最初からやり直す</button>
    </div>`;

  document.getElementById("copyBtn").onclick = () => {
    copyText(text).then((ok) => {
      const st = document.getElementById("copyStatus");
      st.className = "copy-status " + (ok ? "ok" : "ng");
      st.innerHTML = ok
        ? `コピーしました！<br>このままLINEに貼って送ってね ${ICONS.talk}`
        : "コピーできなかったみたい…<br>上の回答を長押しでコピーしてね";
    });
  };
  document.getElementById("restartBtn").onclick = () => {
    if (confirm("回答を消して最初からやり直す？")) {
      answers = [];
      renderStart();
    }
  };
}

renderStart();
</script>
